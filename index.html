<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Soundboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --line: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #fb7185;
      --ok: #34d399;
      --warn: #facc15;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(56, 189, 248, .22), transparent 32%),
        radial-gradient(circle at 85% 15%, rgba(168, 85, 247, .18), transparent 35%),
        linear-gradient(145deg, #020617, var(--bg));
      overflow: hidden;
    }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    .sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 520px;
    }

    button, .file-label {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(12px);
      user-select: none;
      touch-action: manipulation;
    }

    button:active, .file-label:active { transform: scale(.98); }
    button.primary { border-color: rgba(56, 189, 248, .45); background: rgba(56, 189, 248, .18); }
    button.danger { border-color: rgba(251, 113, 133, .42); background: rgba(251, 113, 133, .14); }
    button.ok { border-color: rgba(52, 211, 153, .42); background: rgba(52, 211, 153, .14); }
    button.warn { border-color: rgba(250, 204, 21, .42); background: rgba(250, 204, 21, .14); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .grid {
      min-height: 0;
      display: grid;
      gap: 12px;
    }

    .grid.mode4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .grid.mode9 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .pad {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 18px 54px rgba(0,0,0,.22);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .06s ease, border-color .12s ease, background .12s ease;
      user-select: none;
      text-align: left;
    }

    .pad.empty { border-style: dashed; }
    .pad.hit { transform: scale(.97); border-color: rgba(56, 189, 248, .95); background: rgba(56, 189, 248, .12); }
    .pad:active { transform: scale(.97); }

    .pad::before {
      content: "";
      position: absolute;
      inset: -35%;
      background: radial-gradient(circle, var(--glow), transparent 52%);
      transform: translate(-18%, -18%);
      opacity: .9;
      pointer-events: none;
    }

    .pad:nth-child(1) { --glow: rgba(56, 189, 248, .24); }
    .pad:nth-child(2) { --glow: rgba(168, 85, 247, .24); }
    .pad:nth-child(3) { --glow: rgba(52, 211, 153, .24); }
    .pad:nth-child(4) { --glow: rgba(251, 146, 60, .24); }
    .pad:nth-child(5) { --glow: rgba(244, 114, 182, .24); }
    .pad:nth-child(6) { --glow: rgba(250, 204, 21, .20); }
    .pad:nth-child(7) { --glow: rgba(45, 212, 191, .24); }
    .pad:nth-child(8) { --glow: rgba(129, 140, 248, .24); }
    .pad:nth-child(9) { --glow: rgba(248, 113, 113, .24); }

    .pad-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: clamp(13px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .num {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 950;
    }

    .mode9 .num {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      font-size: 14px;
    }

    .pad-title {
      margin: 0;
      font-size: clamp(18px, 4.5vw, 44px);
      line-height: .95;
      letter-spacing: -0.06em;
      word-break: keep-all;
    }

    .mode9 .pad-title {
      font-size: clamp(15px, 3.4vw, 26px);
      letter-spacing: -0.05em;
    }

    .pad-meta {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .mode9 .pad-meta { font-size: 11px; }

    .edit-badge {
      position: absolute;
      z-index: 2;
      top: 14px;
      right: 14px;
      display: none;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
    }

    body.editing .edit-badge { display: block; }
    .mode9 .edit-badge { top: 9px; right: 9px; padding: 5px 8px; font-size: 10px; }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: end center;
      background: rgba(2, 6, 23, .62);
      backdrop-filter: blur(10px);
      padding: 14px;
    }

    .sheet-backdrop.open { display: grid; }

    .sheet {
      width: min(760px, 100%);
      max-height: min(86dvh, 850px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(15, 23, 42, .96);
      box-shadow: 0 24px 90px rgba(0,0,0,.46);
      padding: 18px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sheet h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .sheet p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .big-action {
      min-height: 92px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      padding: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .big-action strong { font-size: 17px; }
    .big-action span { color: var(--muted); font-size: 12px; line-height: 1.35; }

    .record-panel {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      background: rgba(255,255,255,.06);
    }

    .record-panel.open { display: block; }

    .meter {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.1);
      margin: 12px 0;
    }

    .meter > div {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ok), var(--accent));
      transition: width .08s linear;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }

    .name-input, .preset-input {
      width: 100%;
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .option-panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      background: rgba(255,255,255,.055);
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .option label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    input[type="range"] { width: 100%; }

    .toggle-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .preset-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .preset-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.06);
    }

    .preset-name { font-weight: 900; }
    .preset-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }

    audio { width: 100%; margin-top: 12px; }
    .hidden { display: none; }

    @media (max-width: 720px) {
      header { align-items: flex-start; }
      .controls { max-width: 230px; gap: 6px; }
      .controls button { padding: 9px 10px; font-size: 12px; }
      .grid { gap: 10px; }
      .grid.mode9 { gap: 8px; }
      .pad { border-radius: 24px; }
      .mode9 .pad { border-radius: 20px; }
      .actions, .option-grid { grid-template-columns: 1fr; }
      footer { align-items: flex-start; flex-direction: column; }
      .preset-item { grid-template-columns: 1fr; }
    }

    @media (max-height: 720px) {
      .sub { display: none; }
      .pad-meta { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Soundboard</h1>
        <p class="sub">각 기기 브라우저에만 저장됩니다. 연타/동시터치/랜덤/프리셋 지원.</p>
      </div>
      <div class="controls">
        <button id="modeBtn" class="primary" type="button">9칸 모드</button>
        <button id="randomBtn" class="warn" type="button">🎲 랜덤</button>
        <button id="stopBtn" class="danger" type="button">⏹ 정지</button>
        <button id="presetBtn" class="primary" type="button">프리셋</button>
        <button id="editBtn" class="primary" type="button">편집</button>
        <button id="clearBtn" class="danger" type="button">전체 삭제</button>
      </div>
    </header>

    <section id="grid" class="grid" aria-label="사운드 패드"></section>

    <footer>
      <span>짧게 터치: 재생 · 빈 칸/편집 모드: 녹음/업로드 · PC 숫자키 1~9 · R 랜덤 · Esc 정지</span>
      <span id="status">준비됨</span>
    </footer>
  </main>

  <div id="sheetBackdrop" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div>
          <h2 id="sheetTitle">Pad 설정</h2>
          <p id="sheetDesc">녹음하거나 기존 음성파일을 올리세요.</p>
        </div>
        <button id="closeSheetBtn" type="button">닫기</button>
      </div>

      <input id="nameInput" class="name-input" maxlength="24" placeholder="패드 이름 예: 고양이, 박수, 빵터짐" />

      <div class="option-panel">
        <div class="option-grid">
          <div class="option">
            <label><span>볼륨</span><strong id="volumeValue">100%</strong></label>
            <input id="volumeInput" type="range" min="0" max="100" value="100" />
          </div>
          <div class="option">
            <label><span>재생속도</span><strong id="rateValue">1.00x</strong></label>
            <input id="rateInput" type="range" min="50" max="200" value="100" />
          </div>
        </div>
        <label class="toggle-line">
          <span>속도 변경 시 피치도 같이 변경</span>
          <input id="pitchInput" type="checkbox" />
        </label>
      </div>

      <div class="actions">
        <button id="openRecordBtn" class="big-action" type="button">
          <strong>🎙️ 바로 녹음</strong>
          <span>브라우저 마이크 권한이 필요합니다. HTTPS 배포에서 가장 안정적입니다.</span>
        </button>

        <label class="big-action file-label" for="fileInput">
          <strong>📁 파일 업로드</strong>
          <span>mp3, wav, m4a, webm 등 브라우저가 재생 가능한 음성파일</span>
        </label>
        <input id="fileInput" class="hidden" type="file" accept="audio/*" />
      </div>

      <div id="recordPanel" class="record-panel">
        <p id="recordText">녹음 버튼을 누르면 시작합니다.</p>
        <div class="meter"><div id="meterBar"></div></div>
        <div class="row">
          <button id="startRecordBtn" class="ok" type="button">녹음 시작</button>
          <button id="stopRecordBtn" class="danger" type="button" disabled>녹음 중지</button>
          <button id="saveRecordBtn" class="primary" type="button" disabled>이 녹음 저장</button>
        </div>
        <audio id="recordPreview" controls class="hidden"></audio>
      </div>

      <audio id="currentPreview" controls class="hidden"></audio>

      <div class="row">
        <button id="deletePadBtn" class="danger" type="button">이 패드 삭제</button>
        <button id="saveOptionsBtn" class="primary" type="button">설정 저장</button>
      </div>
    </section>
  </div>

  <div id="presetBackdrop" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="presetTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div>
          <h2 id="presetTitle">프리셋</h2>
          <p>현재 4칸/9칸 구성과 음성파일, 볼륨, 속도, 피치 설정을 통째로 저장합니다. 이 기기 브라우저에만 저장됩니다.</p>
        </div>
        <button id="closePresetBtn" type="button">닫기</button>
      </div>

      <input id="presetNameInput" class="preset-input" maxlength="40" placeholder="프리셋 이름 예: 회의용, 동물농장, 친구놀리기" />
      <div class="row">
        <button id="savePresetBtn" class="ok" type="button">현재 보드 프리셋 저장</button>
      </div>
      <div id="presetList" class="preset-list"></div>
    </section>
  </div>

  <script>
    const DB_NAME = 'local-nine-pad-soundboard';
    const DB_VERSION = 2;
    const PAD_STORE = 'pads';
    const PRESET_STORE = 'presets';
    const MAX_PADS = 9;
    const MODE_KEY = 'soundboard-pad-mode';
    const MAX_ACTIVE_AUDIO = 80;
    const RANDOM_MIN_DELAY = 90;
    const RANDOM_MAX_DELAY = 380;

    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const modeBtn = document.getElementById('modeBtn');
    const randomBtn = document.getElementById('randomBtn');
    const stopBtn = document.getElementById('stopBtn');
    const presetBtn = document.getElementById('presetBtn');
    const editBtn = document.getElementById('editBtn');
    const clearBtn = document.getElementById('clearBtn');

    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetDesc = document.getElementById('sheetDesc');
    const closeSheetBtn = document.getElementById('closeSheetBtn');
    const nameInput = document.getElementById('nameInput');
    const volumeInput = document.getElementById('volumeInput');
    const volumeValue = document.getElementById('volumeValue');
    const rateInput = document.getElementById('rateInput');
    const rateValue = document.getElementById('rateValue');
    const pitchInput = document.getElementById('pitchInput');
    const fileInput = document.getElementById('fileInput');
    const openRecordBtn = document.getElementById('openRecordBtn');
    const recordPanel = document.getElementById('recordPanel');
    const recordText = document.getElementById('recordText');
    const meterBar = document.getElementById('meterBar');
    const startRecordBtn = document.getElementById('startRecordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const saveRecordBtn = document.getElementById('saveRecordBtn');
    const recordPreview = document.getElementById('recordPreview');
    const currentPreview = document.getElementById('currentPreview');
    const deletePadBtn = document.getElementById('deletePadBtn');
    const saveOptionsBtn = document.getElementById('saveOptionsBtn');

    const presetBackdrop = document.getElementById('presetBackdrop');
    const closePresetBtn = document.getElementById('closePresetBtn');
    const presetNameInput = document.getElementById('presetNameInput');
    const savePresetBtn = document.getElementById('savePresetBtn');
    const presetList = document.getElementById('presetList');

    let db;
    let padMode = Number(localStorage.getItem(MODE_KEY)) === 9 ? 9 : 4;
    let pads = Array.from({ length: MAX_PADS }, (_, i) => defaultPad(i));
    let presets = [];
    let selectedPadId = null;
    let editing = false;
    let mediaRecorder = null;
    let recordChunks = [];
    let recordedBlob = null;
    let audioStream = null;
    let meterTimer = null;
    let objectUrls = [];
    let activeAudios = [];
    let randomMode = false;
    let randomTimer = null;

    function defaultPad(i) {
      return {
        id: i,
        name: `Pad ${i + 1}`,
        blob: null,
        type: '',
        updatedAt: null,
        volume: 1,
        rate: 1,
        pitchShift: false
      };
    }

    function normalizePad(item, index) {
      const base = defaultPad(index);
      if (!item) return base;
      return {
        ...base,
        ...item,
        id: index,
        name: item.name || base.name,
        volume: Number.isFinite(item.volume) ? clamp(item.volume, 0, 1) : 1,
        rate: Number.isFinite(item.rate) ? clamp(item.rate, 0.5, 2) : 1,
        pitchShift: Boolean(item.pitchShift)
      };
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const database = req.result;
          if (!database.objectStoreNames.contains(PAD_STORE)) database.createObjectStore(PAD_STORE, { keyPath: 'id' });
          if (!database.objectStoreNames.contains(PRESET_STORE)) database.createObjectStore(PRESET_STORE, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function store(name, mode = 'readonly') {
      return db.transaction(name, mode).objectStore(name);
    }

    function getAll(name) {
      return new Promise((resolve, reject) => {
        const req = store(name).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function put(name, value) {
      return new Promise((resolve, reject) => {
        const req = store(name, 'readwrite').put(value);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function remove(name, id) {
      return new Promise((resolve, reject) => {
        const req = store(name, 'readwrite').delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function clearStore(name) {
      return new Promise((resolve, reject) => {
        const req = store(name, 'readwrite').clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function saveActivePads() {
      await Promise.all(pads.map(p => put(PAD_STORE, p)));
    }

    function formatDate(ts) {
      if (!ts) return '비어 있음';
      const d = new Date(ts);
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function makeUrl(blob) {
      const url = URL.createObjectURL(blob);
      objectUrls.push(url);
      if (objectUrls.length > 100) {
        const old = objectUrls.shift();
        URL.revokeObjectURL(old);
      }
      return url;
    }

    function visiblePads() {
      return pads.slice(0, padMode);
    }

    function renderPads() {
      grid.innerHTML = '';
      grid.className = `grid mode${padMode}`;
      modeBtn.textContent = padMode === 4 ? '9칸 모드' : '4칸 모드';

      visiblePads().forEach((pad, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `pad ${pad.blob ? 'has-sound' : 'empty'}`;
        btn.dataset.padId = String(index);
        btn.setAttribute('aria-label', `${pad.name || `Pad ${index + 1}`} ${pad.blob ? '재생' : '설정'}`);
        btn.innerHTML = `
          <span class="edit-badge">편집</span>
          <div class="pad-inner">
            <div class="num">${index + 1}</div>
            <div class="pad-main">
              <h3 class="pad-title">${escapeHtml(pad.name || `Pad ${index + 1}`)}</h3>
              <p class="pad-meta">${pad.blob ? `${Math.round(pad.volume * 100)}% · ${pad.rate.toFixed(2)}x · 연타 가능` : '녹음/업로드'}</p>
            </div>
          </div>
        `;
        btn.addEventListener('pointerup', event => {
          if (event.button !== undefined && event.button !== 0) return;
          event.preventDefault();
          handlePadTouch(index, btn);
        });
        grid.appendChild(btn);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
    }

    function getPadEl(id) {
      return grid.querySelector(`[data-pad-id="${id}"]`);
    }

    function handlePadTouch(id, el) {
      const pad = pads[id];
      if (editing || !pad.blob) {
        openSheet(id);
        return;
      }
      playPad(id, el);
    }

    function applyAudioOptions(audio, pad) {
      audio.volume = clamp(pad.volume ?? 1, 0, 1);
      audio.playbackRate = clamp(pad.rate ?? 1, 0.5, 2);
      const preserve = !pad.pitchShift;
      if ('preservesPitch' in audio) audio.preservesPitch = preserve;
      if ('mozPreservesPitch' in audio) audio.mozPreservesPitch = preserve;
      if ('webkitPreservesPitch' in audio) audio.webkitPreservesPitch = preserve;
    }

    function playPad(id, el) {
      const pad = pads[id];
      if (!pad.blob) return openSheet(id);

      const audio = new Audio(makeUrl(pad.blob));
      audio.preload = 'auto';
      audio.currentTime = 0;
      applyAudioOptions(audio, pad);

      activeAudios.push(audio);
      if (activeAudios.length > MAX_ACTIVE_AUDIO) {
        const old = activeAudios.shift();
        try { old.pause(); old.src = ''; } catch (_) {}
      }

      pulsePad(el);
      setStatus(`${pad.name || `Pad ${id + 1}`} 재생`);

      const cleanup = () => {
        activeAudios = activeAudios.filter(a => a !== audio);
        try { audio.src = ''; } catch (_) {}
      };

      audio.addEventListener('ended', cleanup, { once: true });
      audio.addEventListener('error', cleanup, { once: true });
      audio.play().catch(() => {
        cleanup();
        setStatus('브라우저가 재생을 막았습니다. 다시 터치해보세요.');
      });
    }

    function pulsePad(el) {
      if (!el) return;
      el.classList.remove('hit');
      void el.offsetWidth;
      el.classList.add('hit');
      setTimeout(() => el.classList.remove('hit'), 130);
    }

    function stopAllSounds() {
      stopRandomMode(false);
      activeAudios.forEach(a => { try { a.pause(); a.src = ''; } catch (_) {} });
      activeAudios = [];
      setStatus('전체 정지');
    }

    function getRandomCandidates() {
      return visiblePads().filter(p => p.blob);
    }

    function playRandomOneShot() {
      const candidates = getRandomCandidates();
      if (!candidates.length) return false;
      const pad = candidates[Math.floor(Math.random() * candidates.length)];
      playPad(pad.id, getPadEl(pad.id));
      return true;
    }

    function toggleRandomMode() {
      if (randomMode) {
        stopRandomMode(true);
        return;
      }

      if (!getRandomCandidates().length) {
        setStatus('랜덤 재생할 패드가 없습니다.');
        return;
      }

      randomMode = true;
      randomBtn.textContent = '🎲 랜덤 ON';
      randomBtn.classList.add('ok');
      randomBtn.classList.remove('warn');
      setStatus('랜덤 폭주 모드 시작');
      randomBurst();
    }

    function stopRandomMode(showStatus = true) {
      randomMode = false;
      if (randomTimer) clearTimeout(randomTimer);
      randomTimer = null;
      randomBtn.textContent = '🎲 랜덤';
      randomBtn.classList.remove('ok');
      randomBtn.classList.add('warn');
      if (showStatus) setStatus('랜덤 폭주 모드 정지');
    }

    function randomBurst() {
      if (!randomMode) return;

      const candidates = getRandomCandidates();
      if (!candidates.length) {
        stopRandomMode(false);
        setStatus('랜덤 재생할 패드가 없어 정지됨');
        return;
      }

      const roll = Math.random();
      const count = roll > 0.88 ? 3 : roll > 0.62 ? 2 : 1;

      for (let i = 0; i < count; i += 1) {
        const delay = i === 0 ? 0 : Math.floor(Math.random() * 80);
        setTimeout(() => {
          if (randomMode) playRandomOneShot();
        }, delay);
      }

      const nextDelay = RANDOM_MIN_DELAY + Math.floor(Math.random() * (RANDOM_MAX_DELAY - RANDOM_MIN_DELAY));
      randomTimer = setTimeout(randomBurst, nextDelay);
    }

    function openSheet(id) {
      selectedPadId = id;
      const pad = pads[id];
      sheetTitle.textContent = `Pad ${id + 1} 설정`;
      sheetDesc.textContent = pad.blob ? '기존 소리를 바꾸거나 삭제할 수 있습니다.' : '녹음하거나 기존 음성파일을 올리세요.';
      nameInput.value = pad.name || `Pad ${id + 1}`;
      volumeInput.value = Math.round((pad.volume ?? 1) * 100);
      rateInput.value = Math.round((pad.rate ?? 1) * 100);
      pitchInput.checked = Boolean(pad.pitchShift);
      updateOptionLabels();
      deletePadBtn.disabled = !pad.blob;
      currentPreview.classList.toggle('hidden', !pad.blob);
      if (pad.blob) {
        currentPreview.src = makeUrl(pad.blob);
        applyAudioOptions(currentPreview, pad);
      }
      resetRecordingUI();
      sheetBackdrop.classList.add('open');
      setTimeout(() => nameInput.focus({ preventScroll: true }), 50);
    }

    function closeSheet() {
      sheetBackdrop.classList.remove('open');
      fileInput.value = '';
      currentPreview.pause();
      currentPreview.removeAttribute('src');
      recordPreview.pause();
      recordPreview.removeAttribute('src');
      stopStream();
      resetRecordingUI();
      selectedPadId = null;
    }

    function updateOptionLabels() {
      volumeValue.textContent = `${volumeInput.value}%`;
      rateValue.textContent = `${(Number(rateInput.value) / 100).toFixed(2)}x`;
    }

    function getOptionsFromSheet() {
      return {
        name: (nameInput.value.trim() || `Pad ${(selectedPadId ?? 0) + 1}`).slice(0, 24),
        volume: clamp(Number(volumeInput.value) / 100, 0, 1),
        rate: clamp(Number(rateInput.value) / 100, 0.5, 2),
        pitchShift: Boolean(pitchInput.checked)
      };
    }

    async function saveBlobToPad(blob, suggestedName) {
      if (selectedPadId === null) return;
      const options = getOptionsFromSheet();
      const pad = {
        ...defaultPad(selectedPadId),
        ...options,
        name: options.name || suggestedName || `Pad ${selectedPadId + 1}`,
        blob,
        type: blob.type || 'audio/webm',
        updatedAt: Date.now()
      };
      await put(PAD_STORE, pad);
      pads[selectedPadId] = pad;
      renderPads();
      setStatus(`${pad.name} 저장됨`);
      closeSheet();
    }

    async function savePadOptions() {
      if (selectedPadId === null) return;
      const old = pads[selectedPadId];
      const options = getOptionsFromSheet();
      const next = { ...old, ...options };
      pads[selectedPadId] = next;
      if (next.blob) await put(PAD_STORE, next);
      renderPads();
      setStatus('설정 저장됨');
      closeSheet();
    }

    function resetRecordingUI() {
      recordPanel.classList.remove('open');
      recordText.textContent = '녹음 버튼을 누르면 시작합니다.';
      meterBar.style.width = '0%';
      startRecordBtn.disabled = false;
      stopRecordBtn.disabled = true;
      saveRecordBtn.disabled = true;
      recordedBlob = null;
      recordChunks = [];
      recordPreview.classList.add('hidden');
      recordPreview.removeAttribute('src');
    }

    function stopStream() {
      if (meterTimer) clearInterval(meterTimer);
      meterTimer = null;
      if (audioStream) audioStream.getTracks().forEach(track => track.stop());
      audioStream = null;
      mediaRecorder = null;
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        setStatus('이 브라우저는 직접 녹음을 지원하지 않습니다. 파일 업로드를 사용하세요.');
        recordText.textContent = '직접 녹음 미지원. 휴대폰 녹음앱으로 녹음 후 파일 업로드를 사용하세요.';
        return;
      }

      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordChunks = [];
        mediaRecorder = new MediaRecorder(audioStream);
        mediaRecorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) recordChunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(recordChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          recordPreview.src = makeUrl(recordedBlob);
          recordPreview.classList.remove('hidden');
          saveRecordBtn.disabled = false;
          startRecordBtn.disabled = false;
          stopRecordBtn.disabled = true;
          recordText.textContent = '녹음 완료. 미리 들어보고 저장하세요.';
          stopStream();
        };
        mediaRecorder.start();
        startRecordBtn.disabled = true;
        stopRecordBtn.disabled = false;
        saveRecordBtn.disabled = true;
        recordText.textContent = '녹음 중...';
        fakeMeter();
      } catch (err) {
        setStatus('마이크 권한이 거부되었거나 HTTPS가 아닙니다.');
        recordText.textContent = '마이크 권한을 허용해야 합니다. 배포할 때는 HTTPS 환경이 필요합니다.';
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    function fakeMeter() {
      if (meterTimer) clearInterval(meterTimer);
      meterTimer = setInterval(() => {
        meterBar.style.width = `${18 + Math.round(Math.random() * 78)}%`;
      }, 90);
    }

    function makeId() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return `preset-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function clonePadsForPreset() {
      return pads.map((pad, index) => ({ ...normalizePad(pad, index) }));
    }

    async function openPresetSheet() {
      presets = await getAll(PRESET_STORE);
      presets.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      renderPresetList();
      presetNameInput.value = '';
      presetBackdrop.classList.add('open');
      setTimeout(() => presetNameInput.focus({ preventScroll: true }), 50);
    }

    function closePresetSheet() {
      presetBackdrop.classList.remove('open');
    }

    function renderPresetList() {
      presetList.innerHTML = '';
      if (!presets.length) {
        const empty = document.createElement('p');
        empty.textContent = '저장된 프리셋이 없습니다.';
        presetList.appendChild(empty);
        return;
      }
      presets.forEach(preset => {
        const item = document.createElement('div');
        item.className = 'preset-item';
        const filled = (preset.pads || []).filter(p => p.blob).length;
        item.innerHTML = `
          <div>
            <div class="preset-name">${escapeHtml(preset.name || '이름 없는 프리셋')}</div>
            <div class="preset-meta">${preset.padMode || 4}칸 · 저장된 소리 ${filled}개 · ${formatDate(preset.updatedAt)}</div>
          </div>
          <button class="primary" data-load-preset="${preset.id}" type="button">불러오기</button>
          <button class="danger" data-delete-preset="${preset.id}" type="button">삭제</button>
        `;
        presetList.appendChild(item);
      });
    }

    async function savePreset() {
      const name = presetNameInput.value.trim() || `프리셋 ${formatDate(Date.now())}`;
      const now = Date.now();
      const preset = {
        id: makeId(),
        name: name.slice(0, 40),
        padMode,
        pads: clonePadsForPreset(),
        createdAt: now,
        updatedAt: now
      };
      await put(PRESET_STORE, preset);
      presets.unshift(preset);
      presetNameInput.value = '';
      renderPresetList();
      setStatus(`${preset.name} 프리셋 저장됨`);
    }

    async function loadPreset(id) {
      const preset = presets.find(p => p.id === id);
      if (!preset) return;
      stopAllSounds();
      padMode = preset.padMode === 9 ? 9 : 4;
      localStorage.setItem(MODE_KEY, String(padMode));
      pads = Array.from({ length: MAX_PADS }, (_, i) => normalizePad((preset.pads || [])[i], i));
      await clearStore(PAD_STORE);
      await saveActivePads();
      renderPads();
      setStatus(`${preset.name} 불러옴`);
      closePresetSheet();
    }

    async function deletePreset(id) {
      const preset = presets.find(p => p.id === id);
      if (!preset) return;
      if (!confirm(`프리셋 '${preset.name}'을 삭제할까요?`)) return;
      await remove(PRESET_STORE, id);
      presets = presets.filter(p => p.id !== id);
      renderPresetList();
      setStatus('프리셋 삭제됨');
    }

    async function load() {
      db = await openDB();
      const saved = await getAll(PAD_STORE);
      saved.forEach(item => {
        if (Number.isInteger(item.id) && item.id >= 0 && item.id < MAX_PADS) pads[item.id] = normalizePad(item, item.id);
      });
      renderPads();
      setStatus('준비됨');
    }

    modeBtn.addEventListener('click', () => {
      padMode = padMode === 4 ? 9 : 4;
      localStorage.setItem(MODE_KEY, String(padMode));
      renderPads();
      setStatus(`${padMode}칸 모드`);
    });

    randomBtn.addEventListener('click', toggleRandomMode);
    stopBtn.addEventListener('click', stopAllSounds);
    presetBtn.addEventListener('click', openPresetSheet);

    editBtn.addEventListener('click', () => {
      editing = !editing;
      document.body.classList.toggle('editing', editing);
      editBtn.textContent = editing ? '재생 모드' : '편집';
      setStatus(editing ? '편집 모드' : '재생 모드');
    });

    clearBtn.addEventListener('click', async () => {
      if (!confirm(`이 기기에 저장된 ${MAX_PADS}개 패드를 모두 삭제할까요? 프리셋은 유지됩니다.`)) return;
      stopAllSounds();
      await clearStore(PAD_STORE);
      pads = Array.from({ length: MAX_PADS }, (_, i) => defaultPad(i));
      renderPads();
      setStatus('전체 삭제됨');
    });

    closeSheetBtn.addEventListener('click', closeSheet);
    sheetBackdrop.addEventListener('click', event => {
      if (event.target === sheetBackdrop) closeSheet();
    });

    closePresetBtn.addEventListener('click', closePresetSheet);
    presetBackdrop.addEventListener('click', event => {
      if (event.target === presetBackdrop) closePresetSheet();
    });

    presetList.addEventListener('click', async event => {
      const loadBtn = event.target.closest('[data-load-preset]');
      const deleteBtn = event.target.closest('[data-delete-preset]');
      if (loadBtn) await loadPreset(loadBtn.dataset.loadPreset);
      if (deleteBtn) await deletePreset(deleteBtn.dataset.deletePreset);
    });

    savePresetBtn.addEventListener('click', savePreset);

    openRecordBtn.addEventListener('click', () => {
      recordPanel.classList.toggle('open');
    });

    startRecordBtn.addEventListener('click', startRecording);
    stopRecordBtn.addEventListener('click', stopRecording);
    saveRecordBtn.addEventListener('click', () => {
      if (recordedBlob) saveBlobToPad(recordedBlob, '녹음');
    });

    volumeInput.addEventListener('input', updateOptionLabels);
    rateInput.addEventListener('input', updateOptionLabels);
    pitchInput.addEventListener('change', () => {
      if (currentPreview.src && selectedPadId !== null) {
        const tempPad = { ...pads[selectedPadId], ...getOptionsFromSheet() };
        applyAudioOptions(currentPreview, tempPad);
      }
    });

    fileInput.addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('audio/')) {
        setStatus('음성파일만 올릴 수 있습니다.');
        return;
      }
      const name = file.name.replace(/\.[^.]+$/, '').slice(0, 24);
      if (!nameInput.value.trim()) nameInput.value = name;
      await saveBlobToPad(file, name);
    });

    deletePadBtn.addEventListener('click', async () => {
      if (selectedPadId === null) return;
      const id = selectedPadId;
      await remove(PAD_STORE, id);
      pads[id] = defaultPad(id);
      renderPads();
      setStatus(`Pad ${id + 1} 삭제됨`);
      closeSheet();
    });

    saveOptionsBtn.addEventListener('click', savePadOptions);

    window.addEventListener('keydown', event => {
      if (event.repeat) return;
      if (sheetBackdrop.classList.contains('open') || presetBackdrop.classList.contains('open')) return;
      if (event.key.toLowerCase() === 'r') return toggleRandomMode();
      if (event.key === 'Escape') return stopAllSounds();
      const n = Number(event.key);
      if (!Number.isInteger(n) || n < 1 || n > padMode) return;
      handlePadTouch(n - 1, getPadEl(n - 1));
    });

    window.addEventListener('beforeunload', () => {
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      stopAllSounds();
      stopStream();
    });

    load().catch(err => {
      console.error(err);
      setStatus('저장소 초기화 실패');
      alert('이 브라우저에서 로컬 저장소를 열 수 없습니다. 시크릿 모드이거나 저장소가 차단되었을 수 있습니다.');
    });
  </script>
</body>
</html>
